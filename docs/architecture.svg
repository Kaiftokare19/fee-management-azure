<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 640" font-family="Segoe UI, Arial, sans-serif" font-size="13">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0L10 5L0 10z" fill="#5f6b7a"/>
    </marker>
  </defs>
  <rect width="1000" height="640" fill="#ffffff"/>

  <text x="24" y="36" font-size="20" font-weight="600" fill="#1f2937">Fee Management System on Azure</text>
  <text x="24" y="58" font-size="13" fill="#6b7280">Every client call passes API Management; admin calls also need an Entra ID token with the Fee.Admin role</text>

  <!-- Monitoring band -->
  <rect x="210" y="80" width="766" height="44" rx="8" fill="#f3f0ff" stroke="#8b5cf6" stroke-width="1.25"/>
  <text x="593" y="100" text-anchor="middle" font-weight="600" fill="#1f2937">Application Insights + Log Analytics</text>
  <text x="593" y="116" text-anchor="middle" font-size="12" fill="#4b5563">requests, failures (401 / 429 / 400 / 500), latency, live metrics, KQL queries</text>
  <g stroke="#8b5cf6" stroke-width="1" stroke-dasharray="4 4" fill="none">
    <path d="M300 124V170"/>
    <path d="M557 124V170"/>
  </g>

  <!-- Clients -->
  <rect x="24" y="170" width="150" height="56" rx="8" fill="none" stroke="#5f6b7a" stroke-width="1.25"/>
  <text x="99" y="194" text-anchor="middle" font-weight="600" fill="#1f2937">Student app</text>
  <text x="99" y="212" text-anchor="middle" font-size="12" fill="#4b5563">subscription key</text>

  <rect x="24" y="250" width="150" height="56" rx="8" fill="none" stroke="#5f6b7a" stroke-width="1.25"/>
  <text x="99" y="274" text-anchor="middle" font-weight="600" fill="#1f2937">Admin tool</text>
  <text x="99" y="292" text-anchor="middle" font-size="12" fill="#4b5563">key + Bearer token</text>

  <rect x="24" y="360" width="150" height="72" rx="8" fill="none" stroke="#5f6b7a" stroke-width="1.25"/>
  <text x="99" y="384" text-anchor="middle" font-weight="600" fill="#1f2937">Microsoft Entra ID</text>
  <text x="99" y="402" text-anchor="middle" font-size="12" fill="#4b5563">app role Fee.Admin</text>
  <text x="99" y="418" text-anchor="middle" font-size="12" fill="#4b5563">client credentials</text>

  <!-- APIM -->
  <rect x="210" y="170" width="180" height="136" rx="8" fill="#e8f1fd" stroke="#2563eb" stroke-width="2"/>
  <text x="300" y="194" text-anchor="middle" font-weight="600" fill="#1f2937">API Management</text>
  <text x="300" y="210" text-anchor="middle" font-size="12" fill="#4b5563">Consumption tier</text>
  <text x="224" y="234" font-size="12" fill="#1f2937">&#8226; subscription key check</text>
  <text x="224" y="252" font-size="12" fill="#1f2937">&#8226; rate-limit 10 calls / 60 s</text>
  <text x="224" y="270" font-size="12" fill="#1f2937">&#8226; admin ops: validate-jwt</text>
  <text x="224" y="288" font-size="12" fill="#1f2937">   + roles = Fee.Admin</text>

  <!-- Functions -->
  <rect x="450" y="170" width="214" height="136" rx="8" fill="none" stroke="#5f6b7a" stroke-width="1.25"/>
  <text x="557" y="194" text-anchor="middle" font-weight="600" fill="#1f2937">Azure Functions</text>
  <text x="557" y="210" text-anchor="middle" font-size="12" fill="#4b5563">Node.js 22, Consumption</text>
  <text x="464" y="234" font-size="12" fill="#1f2937">GET /students/{id}/fee</text>
  <text x="464" y="252" font-size="12" fill="#1f2937">GET /manage/students</text>
  <text x="464" y="270" font-size="12" fill="#1f2937">PUT /manage/students/{id}/fee</text>
  <text x="464" y="288" font-size="12" fill="#1f2937">SQL retry + connection pool</text>

  <!-- SQL -->
  <rect x="690" y="170" width="286" height="136" rx="8" fill="none" stroke="#5f6b7a" stroke-width="1.25"/>
  <text x="833" y="194" text-anchor="middle" font-weight="600" fill="#1f2937">Azure SQL Database (FeeDB)</text>
  <text x="833" y="210" text-anchor="middle" font-size="12" fill="#4b5563">serverless, free offer, auto-pause</text>
  <text x="704" y="234" font-size="12" fill="#1f2937">Students (CHECK constraints, DueDate index)</text>
  <text x="704" y="252" font-size="12" fill="#1f2937">Administrators</text>
  <text x="704" y="270" font-size="12" fill="#1f2937">FeeAuditLog (who / old / new / when)</text>
  <text x="704" y="288" font-size="12" fill="#1f2937">vw_OverdueStudents</text>

  <!-- Storage -->
  <rect x="450" y="340" width="180" height="56" rx="8" fill="none" stroke="#5f6b7a" stroke-width="1.25"/>
  <text x="540" y="364" text-anchor="middle" font-weight="600" fill="#1f2937">Storage account</text>
  <text x="540" y="382" text-anchor="middle" font-size="12" fill="#4b5563">Functions runtime state</text>

  <!-- Logic App + email -->
  <rect x="690" y="430" width="286" height="88" rx="8" fill="none" stroke="#5f6b7a" stroke-width="1.25"/>
  <text x="833" y="454" text-anchor="middle" font-weight="600" fill="#1f2937">Logic App (Consumption)</text>
  <text x="704" y="476" font-size="12" fill="#1f2937">Recurrence: daily 09:00 IST</text>
  <text x="704" y="494" font-size="12" fill="#1f2937">SQL query &#8594; For each student &#8594; email</text>
  <text x="704" y="510" font-size="12" fill="#1f2937">Exponential retry: 4 tries from 10 s</text>

  <rect x="450" y="446" width="180" height="56" rx="8" fill="none" stroke="#5f6b7a" stroke-width="1.25"/>
  <text x="540" y="470" text-anchor="middle" font-weight="600" fill="#1f2937">Outlook.com</text>
  <text x="540" y="488" text-anchor="middle" font-size="12" fill="#4b5563">reminder to each student</text>

  <!-- Connectors -->
  <g stroke="#5f6b7a" stroke-width="1.25" fill="none">
    <path d="M174 198H210" marker-end="url(#arrow)"/>
    <path d="M174 278H210" marker-end="url(#arrow)"/>
    <path d="M99 360V306" marker-end="url(#arrow)"/>
    <path d="M390 238H450" marker-end="url(#arrow)"/>
    <path d="M664 238H690" marker-end="url(#arrow)"/>
    <path d="M540 306V340" marker-end="url(#arrow)"/>
    <path d="M833 430V306" marker-end="url(#arrow)"/>
    <path d="M690 474H630" marker-end="url(#arrow)"/>
  </g>
  <text x="108" y="338" font-size="12" fill="#6b7280">token with roles: Fee.Admin</text>
  <text x="420" y="230" text-anchor="middle" font-size="11" fill="#6b7280">fn key</text>
  <text x="842" y="372" font-size="12" fill="#6b7280">reads overdue view</text>

  <!-- Legend -->
  <text x="24" y="580" font-size="12" fill="#4b5563">Region: Central India &#183; Resource group: rg-feemgmt-demo &#183; Gateway: https://apim-feemgmt-kaif.azure-api.net/fees</text>
  <text x="24" y="600" font-size="12" fill="#4b5563">Solid arrows = request / data flow &#183; Dashed lines = telemetry to Application Insights</text>
</svg>
